name: Pipeline de Integración Continua (CI)

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Compilación, Pruebas y Rendimiento
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente del repositorio (v4)
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar el entorno Java JDK 8 (v4)
      - name: Configurar JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compilar el proyecto y ejecutar pruebas unitarias (JUnit) y BDD (Cucumber)
      - name: Ejecutar pruebas unitarias y BDD con Maven
        run: mvn clean test

      # 4. Publicar reportes de pruebas BDD como artefactos (v4 - Solución al error)
      - name: Publicar reporte de pruebas BDD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-cucumber
          path: target/cucumber-reports/

      # 5. Ejecutar pruebas de rendimiento con k6 (Quality Gate)
      - name: Ejecutar pruebas de rendimiento con k6
        uses: grafana/k6-action@v0.3.0
        with:
          filename: src/test/resources/performance/performance_test.js

      # 6. Notificación y Alertas Automáticas
      - name: Notificar resultado del pipeline
        if: failure()
        run: |
          echo "⚠️ [ALERTA CI] El pipeline ha fallado en la rama \${{ github.ref_name }}."
          echo "Revisar los logs del build en: \${{ github.server_url }}/\\({{ github.repository }}/actions/runs/\\){{ github.run_id }}"