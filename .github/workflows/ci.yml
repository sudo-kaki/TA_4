name: Pipeline de Integración Continua (CI)
on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    name: Compilación, Pruebas y Rendimiento
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v3
      # 2. Configurar el entorno de Java 8
      - name: Configurar JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      # 3. Compilar el proyecto y ejecutar las pruebas de Maven (JUnit + BDD)
      - name: Ejecutar pruebas unitarias y BDD
        run: mvn clean test
      # 4. Generar y publicar reportes de pruebas BDD como artefactos
      - name: Publicar reporte de pruebas BDD
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: reporte-pruebas-cucumber
          path: target/cucumber-reports/
      # 5. Ejecutar pruebas de rendimiento con k6 (Quality Gate)
      - name: Ejecutar pruebas de rendimiento con k6
        uses: grafana/k6-action@v0.3.0
        with:
          filename: src/test/resources/performance/performance_test.js
      # 6. Notificación y Alertas Automáticas (Simulación de Webhook/Alerta)
      - name: Notificar resultado del pipeline
        if: failure()
        run: |
          echo "⚠️ [ALERTA CI] El pipeline ha fallado en la rama \${{ github.ref_name }}."
          echo "Revisar los logs del build en: \${{ github.server_url }}/\\({{ github.repository }}/actions/runs/\\){{ github.run_id }}"