name: Pipeline de Integración Continua (CI)

on:
  push:
    branches: [ main, "feature/*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v3

      # 2. Configurar el entorno de Java 8
      - name: Configurar JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Compilar el proyecto y ejecutar las pruebas de Maven (JUnit + BDD)
      - name: Ejecutar pruebas unitarias y BDD
        run: mvn clean test

      # 4. Ejecutar la prueba de rendimiento de carga con k6
      - name: Ejecutar pruebas de rendimiento con k6
        uses: grafana/k6-action@v0.3.0
        with:
          filename: src/test/resources/performance/performance_test.js